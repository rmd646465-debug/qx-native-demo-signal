plugins {
    id "com.android.application"
}

android {
    namespace "com.qx.adaptiveedge"
    compileSdk 35

    defaultConfig {
        applicationId "com.qx.adaptiveedge"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.3.1-continuous-smart-scan"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
