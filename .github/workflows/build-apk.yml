name: Build QX Stable Close Demo APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "adaptive-build-v1"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify contextual closed-candle engine
        run: |
          mkdir -p build/engine-test
          javac -d build/engine-test \
            app/src/main/java/com/qx/adaptiveedge/SignalEngine.java \
            app/src/main/java/com/qx/adaptiveedge/SignalStability.java \
            app/src/main/java/com/qx/adaptiveedge/SignalLockBook.java \
            engine-test/com/qx/adaptiveedge/SignalEngineSelfTest.java
          java -cp build/engine-test com.qx.adaptiveedge.SignalEngineSelfTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: QX-Stable-Close-Demo-APK-v4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
